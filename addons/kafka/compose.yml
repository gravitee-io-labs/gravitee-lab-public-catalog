x-gravitee:
  kind: addon
  name: Kafka
  category: Event
  description: Kafka broker, Kafka UI, and the gateway's native Kafka entrypoint

services:

  kafka:
    image: docker.io/bitnamilegacy/kafka:${KAFKA_VERSION:-3.9}   # Kafka version (image tag)
    container_name: gio-kafka
    restart: unless-stopped
    depends_on:
      kafka-certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9091:9091"   # PLAINTEXT
      - "127.0.0.1:9094:9094"   # SSL
      - "127.0.0.1:9095:9095"   # SASL_PLAINTEXT
      - "127.0.0.1:9096:9096"   # SASL_SSL
    volumes:
      - data-kafka:/bitnami/kafka
      # Key, certificate and truststore made by kafka-certs
      - ./.state/certs/server.key:/bitnami/kafka/config/certs/kafka.keystore.key:ro
      - ./.state/certs/server.crt:/bitnami/kafka/config/certs/kafka.keystore.pem:ro
      - ./.state/certs/server.crt:/bitnami/kafka/config/certs/kafka.truststore.pem:ro
    environment:
      # KRaft
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listeners
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9091,CONTROLLER://:9093,SSL://:9094,SASL_PLAINTEXT://:9095,SASL_SSL://:9096
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9091,SSL://kafka:9094,SASL_PLAINTEXT://kafka:9095,SASL_SSL://kafka:9096
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL,CONTROLLER:PLAINTEXT

      # SASL
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_CLIENT_USERS: gravitee_user
      KAFKA_CLIENT_PASSWORDS: ${KAFKA_CLIENT_PASSWORD:-gravitee_password}   # Password of the SASL user gravitee_user
      KAFKA_CONTROLLER_USER: controller_user
      KAFKA_CONTROLLER_PASSWORD: ${KAFKA_CONTROLLER_PASSWORD:-controller_password}   # Password of the broker's controller user
      KAFKA_INTER_BROKER_USER: inter_broker_user
      KAFKA_INTER_BROKER_PASSWORD: ${KAFKA_INTER_BROKER_PASSWORD:-inter_broker_password}   # Password of the user the brokers use between them

      # TLS
      KAFKA_TLS_TYPE: PEM   # The key is not encrypted: do not set KAFKA_CERTIFICATE_PASSWORD
      KAFKA_TLS_CLIENT_AUTH: requested
      KAFKA_CFG_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""

      # Broker
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "1"
    labels:
      io.gravitee.name: Kafka broker
      io.gravitee.description: Single-node Kafka broker with plaintext, SSL and SASL listeners
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9091"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - internal

  kafka-client:
    image: docker.io/bitnamilegacy/kafka:${KAFKA_VERSION:-3.9}
    container_name: gio-kafka-client
    restart: unless-stopped
    entrypoint: ["tail", "-f", "/dev/null"]
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./.state/certs:/app/.ssl:ro
    labels:
      io.gravitee.name: Kafka client
      io.gravitee.description: Container with the Kafka command-line tools, to run against the broker
    networks:
      - internal

  kafka-ui:
    image: kafbat/kafka-ui:${KAFKA_UI_VERSION:-v1.5.0}   # Kafka UI version (image tag)
    container_name: gio-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8080"   # Web UI
    environment:
      # The lab's broker, already connected
      KAFKA_CLUSTERS_0_NAME: Gravitee Lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9091
      DYNAMIC_CONFIG_ENABLED: "true"   # Add other clusters from the UI
    labels:
      io.gravitee.name: Kafka UI
      io.gravitee.description: Web UI to browse topics, messages and consumer groups
      io.gravitee.console.kafka-ui.name: Kafka UI
      io.gravitee.console.kafka-ui.url: http://localhost:8088
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - internal

  kafka-certs:
    image: alpine/openssl:${KAFKA_CERTS_VERSION:-3.5.9}   # OpenSSL version (image tag), which makes the certificates
    container_name: gio-kafka-certs
    restart: "no"
    entrypoint: ["sh", "/certs.sh"]   # Makes what is missing in /certs, then exits
    environment:
      KAFKA_GATEWAY_KEYSTORE_PASSWORD: ${KAFKA_GATEWAY_KEYSTORE_PASSWORD:-gravitee}   # Password of the gateway's keystore, kafka-gateway.p12; a new value makes the gateway's certificate again at the next start
    volumes:
      - ./.state/certs:/certs
      - ./certs.sh:/certs.sh:ro
    labels:
      io.gravitee.name: Kafka certificates
      io.gravitee.description: Makes the self-signed certificates of the broker and of the gateway's Kafka entrypoint when they are missing, then exits
    networks:
      - internal

  apim-gateway:
    depends_on:
      kafka-certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9092:9092"   # Kafka entrypoint
    volumes:
      - ./.state/certs:/opt/graviteeio-gateway/ssl:ro
    environment:
      # Kafka entrypoint
      gravitee_kafka_enabled: "true"
      gravitee_kafka_routingHostMode_domains_0: kafka.local
      gravitee_kafka_ssl_keystore_type: pkcs12
      gravitee_kafka_ssl_keystore_path: /opt/graviteeio-gateway/ssl/kafka-gateway.p12
      gravitee_kafka_ssl_keystore_password: ${KAFKA_GATEWAY_KEYSTORE_PASSWORD:-gravitee}

volumes:
  data-kafka:
