x-gravitee:
  kind: addon
  name: Kafka
  category: Event
  description: Kafka broker, Kafka UI, and the gateway's native Kafka entrypoint

services:

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}   # Kafka version (image tag)
    container_name: gio-kafka
    restart: unless-stopped
    depends_on:
      kafka-certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9091:9091"   # PLAINTEXT
      - "127.0.0.1:9094:9094"   # SSL
      - "127.0.0.1:9095:9095"   # SASL_PLAINTEXT
      - "127.0.0.1:9096:9096"   # SASL_SSL
    volumes:
      - data-kafka-broker:/var/lib/kafka/data
      # Keystore, truststore and their password file, made by kafka-certs
      - ./.state/certs:/etc/kafka/secrets:ro
    environment:
      # KRaft, one node that is its own controller
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9091,CONTROLLER://:9093,SSL://:9094,SASL_PLAINTEXT://:9095,SASL_SSL://:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9091,SSL://kafka:9094,SASL_PLAINTEXT://kafka:9095,SASL_SSL://kafka:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # SASL: gravitee_user signs in with PLAIN or SCRAM (kafka-users stores its SCRAM credentials)
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      KAFKA_LISTENER_NAME_SASL__PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: &plain-users org.apache.kafka.common.security.plain.PlainLoginModule required user_gravitee_user="${KAFKA_CLIENT_PASSWORD:-gravitee_password}";   # Password of the SASL user gravitee_user
      KAFKA_LISTENER_NAME_SASL__SSL_PLAIN_SASL_JAAS_CONFIG: *plain-users
      KAFKA_LISTENER_NAME_SASL__PLAINTEXT_SCRAM___SHA___256_SASL_JAAS_CONFIG: &scram org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_LISTENER_NAME_SASL__PLAINTEXT_SCRAM___SHA___512_SASL_JAAS_CONFIG: *scram
      KAFKA_LISTENER_NAME_SASL__SSL_SCRAM___SHA___256_SASL_JAAS_CONFIG: *scram
      KAFKA_LISTENER_NAME_SASL__SSL_SCRAM___SHA___512_SASL_JAAS_CONFIG: *scram
      KAFKA_OPTS: -Djava.security.auth.login.config=/opt/kafka/config/kafka_server_jaas.conf   # The image asks for it with SASL listeners; the listeners above carry their own login

      # TLS: PKCS12 keystore and truststore in /etc/kafka/secrets, as the image reads them
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_FILENAME: kafka-broker.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka-broker.password
      KAFKA_SSL_KEY_CREDENTIALS: kafka-broker.password
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka-broker-trust.p12
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: kafka-broker.password
      KAFKA_SSL_CLIENT_AUTH: requested

      # Broker: one node, so every internal topic has one replica
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    labels:
      io.gravitee.name: Kafka broker
      io.gravitee.description: Single-node Kafka broker with plaintext, SSL and SASL listeners
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9091"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - internal

  kafka-users:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    container_name: gio-kafka-users
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CLIENT_PASSWORD: ${KAFKA_CLIENT_PASSWORD:-gravitee_password}   # Password of the SASL user gravitee_user
    # One request per mechanism: the broker refuses two changes of one user in one request
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for mechanism in SCRAM-SHA-256 SCRAM-SHA-512; do
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9091 --alter --entity-type users --entity-name gravitee_user \
            --add-config "$$mechanism=[password=$$CLIENT_PASSWORD]"
        done
    labels:
      io.gravitee.name: Kafka users
      io.gravitee.description: Stores the SCRAM credentials of gravitee_user in the broker at each start, then exits
    networks:
      - internal

  kafka-client:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    container_name: gio-kafka-client
    restart: unless-stopped
    entrypoint: ["tail", "-f", "/dev/null"]
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./.state/certs:/app/.ssl:ro
    environment:
      PATH: /opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin   # The Kafka command-line tools, by name
    labels:
      io.gravitee.name: Kafka client
      io.gravitee.description: Container with the Kafka command-line tools, to run against the broker
    networks:
      - internal

  kafka-ui:
    image: kafbat/kafka-ui:${KAFKA_UI_VERSION:-v1.5.0}   # Kafka UI version (image tag)
    container_name: gio-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8080"   # Web UI
    environment:
      # The lab's broker, already connected
      KAFKA_CLUSTERS_0_NAME: Gravitee Lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9091
      DYNAMIC_CONFIG_ENABLED: "true"   # Add other clusters from the UI
    labels:
      io.gravitee.name: Kafka UI
      io.gravitee.description: Web UI to browse topics, messages and consumer groups
      io.gravitee.console.kafka-ui.name: Kafka UI
      io.gravitee.console.kafka-ui.url: http://localhost:8088
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - internal

  kafka-certs:
    image: alpine/openssl:${KAFKA_CERTS_VERSION:-3.5.9}   # OpenSSL version (image tag), which makes the certificates
    container_name: gio-kafka-certs
    restart: "no"
    entrypoint: ["sh", "/certs.sh"]   # Makes what is missing in /certs, then exits
    environment:
      KAFKA_BROKER_KEYSTORE_PASSWORD: ${KAFKA_BROKER_KEYSTORE_PASSWORD:-gravitee}   # Password of the broker's keystore and truststore, kafka-broker.p12 and kafka-broker-trust.p12; a new value makes them again at the next start
      KAFKA_GATEWAY_KEYSTORE_PASSWORD: ${KAFKA_GATEWAY_KEYSTORE_PASSWORD:-gravitee}   # Password of the gateway's keystore, kafka-gateway.p12; a new value makes the gateway's certificate again at the next start
    volumes:
      - ./.state/certs:/certs
      - ./certs.sh:/certs.sh:ro
    labels:
      io.gravitee.name: Kafka certificates
      io.gravitee.description: Makes the self-signed certificates of the broker and of the gateway's Kafka entrypoint when they are missing, then exits
    networks:
      - internal

  apim-gateway:
    depends_on:
      kafka-certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9092:9092"   # Kafka entrypoint
    volumes:
      - ./.state/certs:/opt/graviteeio-gateway/ssl:ro
    environment:
      # Kafka entrypoint
      gravitee_kafka_enabled: "true"
      gravitee_kafka_routingHostMode_domains_0: kafka.local
      gravitee_kafka_ssl_keystore_type: pkcs12
      gravitee_kafka_ssl_keystore_path: /opt/graviteeio-gateway/ssl/kafka-gateway.p12
      gravitee_kafka_ssl_keystore_password: ${KAFKA_GATEWAY_KEYSTORE_PASSWORD:-gravitee}

volumes:
  data-kafka-broker:
