x-gravitee:
  kind: addon
  name: MCPJam Inspector
  category: AI
  description: Client for MCP servers, with tool calls and an LLM chat, via the gateway or directly

services:

  mcp-inspector:
    build:
      context: .
      args:
        MCPJAM_VERSION: ${MCP_INSPECTOR_VERSION:-3.13.0}   # MCPJam Inspector version (npm package @mcpjam/inspector)
    image: ghcr.io/gravitee-io-labs/gravitee-lab-public-catalog/mcp-inspector-mcp-inspector:latest
    pull_policy: ${MCP_INSPECTOR_PULL_POLICY:-build}   # build: build it here at each start; never: build it here once; always: pull it, build it here if it cannot be pulled
    container_name: gio-mcp-inspector
    restart: unless-stopped
    ports:
      - "127.0.0.1:6274:6274"   # Web UI
    volumes:
      - data-mcp-inspector:/home/node/.mcpjam
    environment:
      # Token that signs a browser in from the console link (24+ letters, digits, - or _)
      MCPJAM_SESSION_TOKEN: ${MCP_INSPECTOR_SESSION_TOKEN:-gravitee-lab-local-inspector}
      MCPJAM_INSPECTOR_FRONTEND_URL: http://localhost:6274
      MCPJAM_ALLOWED_HOSTS: ${MCP_INSPECTOR_ALLOWED_HOSTS:-}   # Other host names it answers to, comma-separated
      # Turn off the local shell and browser tools in the container
      MCPJAM_LOCAL_COMPUTER_ENABLED: "false"
      MCPJAM_LOCAL_BROWSER_ENABLED: "false"
      DO_NOT_TRACK: "1"   # No usage or error reports to MCPJam
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Reach Ollama running on this machine (also on Linux)
    labels:
      io.gravitee.name: MCPJam Inspector
      io.gravitee.description: Connects to MCP servers, calls their tools and chats with them through an LLM
      io.gravitee.console.mcp-inspector.name: MCPJam Inspector
      io.gravitee.console.mcp-inspector.url: http://localhost:6274/#token=${MCP_INSPECTOR_SESSION_TOKEN:-gravitee-lab-local-inspector}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:6274/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - internal

volumes:
  data-mcp-inspector:
