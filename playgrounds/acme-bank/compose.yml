# Demo secrets shared by every container that needs them; change one in the shell or in playgrounds/acme-bank/.env
x-bank-secrets:
  demo-password: &demo-password ${ACME_BANK_DEMO_PASSWORD:-HelloWorld@123}                             # Password of Alice, Bob and Tina
  web-client-secret: &web-client-secret ${ACME_BANK_WEB_CLIENT_SECRET:-acme-bank-web}                  # Secret of the acme-bank-web application in Access Management (the web app's sign-in)
  traffic-client-secret: &traffic-client-secret ${ACME_BANK_TRAFFIC_CLIENT_SECRET:-acme-bank-traffic}  # Secret of the acme-bank-traffic application in Access Management (traffic generator and seed)
  ace-client-secret: &ace-client-secret ${ACME_BANK_ACE_CLIENT_SECRET:-ace-agent}                      # Secret of Ace's application in Access Management
  mcp-resource-secret: &mcp-resource-secret ${ACME_BANK_MCP_RESOURCE_SECRET:-acme-bank-mcp}            # Secret of the MCP server's resource in Access Management
  ace-llm-key: &ace-llm-key ${ACME_BANK_ACE_LLM_API_KEY:-acme-ace-llm-key}                             # API key of Ace on the LLM proxy
  dev-llm-key: &dev-llm-key ${ACME_BANK_DEV_LLM_API_KEY:-acme-dev-llm-key}                             # API key of the Developers plan on the LLM proxy
  traffic-llm-key: &traffic-llm-key ${ACME_BANK_TRAFFIC_LLM_API_KEY:-acme-traffic-llm-key}             # API key of the Traffic plan on the LLM proxy
  admin-token: &admin-token ${ACME_BANK_ADMIN_TOKEN:-acme-bank-admin}                                  # Token that allows resetting the bank's data
  apim-password: &apim-password ${ACME_BANK_APIM_PASSWORD:-admin}                                      # Password of user admin in API Management
  am-password: &am-password ${ACME_BANK_AM_PASSWORD:-adminadmin}                                       # Password of user admin in Access Management

# Administrator login for the seed, the web app and the traffic generator
x-bank-platform-login: &platform-login
  APIM_USERNAME: admin
  APIM_PASSWORD: *apim-password

x-gravitee:
  kind: playground
  name: ACME Bank
  category: AI
  description: Protection of an AI agent in production with Gravitee Gamma, one lesson at a time
  tags: [Gamma, AI Agents, LLM Proxy, MCP, Guard Rails, Authorization, Budgets, Tracing]
  duration: 35 min
  first_start: 10 min
  requires:
    images:
      APIM_VERSION: "4.13.1"   # Gamma's lists start at page 1 and answer `data`
      AM_VERSION: "4.13.0-alpha.9"   # a pre-release (alpha) build of 4.13: a bare 4.13 is the release, which comes after them
    license:
      - gamma-aim-module
      - apim-mcp-proxy-reactor              # the MCP proxy, and its mcp-acl policy
      - gamma-authz-module
      - gamma-authz-reactor
      - gamma-authz-policy-pep
      - gamma-authz-service-pdp
      - gamma-aim-entrypoint-mcp-studio     # MCP Studio and the tools of a REST API
      - gamma-aim-endpoint-tools-mcp
      - gamma-aim-endpoint-tools-http
    host:
      - name: Ollama with qwen3:1.7b
        check: http://localhost:11434/api/tags
        expect: qwen3:1.7b
        help: Install Ollama (ollama.com/download), then run `ollama pull qwen3:1.7b`; the containers must be able to reach it (Troubleshooting, Ollama)
      - name: Ollama with qwen3:0.6b
        check: http://localhost:11434/api/tags
        expect: qwen3:0.6b
        help: Run `ollama pull qwen3:0.6b`; the containers must be able to reach Ollama (Troubleshooting, Ollama)
      - name: Hugging Face (the gateway's AI models)
        check: https://huggingface.co
        help: The gateway downloads its AI models (129 MB) from huggingface.co when it first deploys the LLM proxy. Without access the seed ends with a timeout
  tested:
    - APIM_VERSION: "4.13.1"
      APIM_REGISTRY: graviteeio
      AM_VERSION: "4.13.1"
      AM_REGISTRY: graviteeio
  consoles: [bank-web, gamma-ui]
  accounts:
    - for: "ACME Bank: Alice (customer)"
      username: alice@acme-bank.test
      password: *demo-password
    - for: "ACME Bank: Bob (customer)"
      username: bob@acme-bank.test
      password: *demo-password
    - for: "ACME Bank: Tina (teller)"
      username: tina@acme-bank.test
      password: *demo-password
    - for: "ACME Bank LLM proxy: Developers key"
      key: *dev-llm-key
    - for: Gamma and API Management consoles
      username: admin
      password: *apim-password
    - for: Access Management console
      username: admin
      password: *am-password

x-bank-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 20

include:
  - ../../addons/gamma-tracing/compose.yml          # Gamma Tracing

services:

  bank-mcp:
    image: ghcr.io/gravitee-io-labs/gravitee-lab-public-catalog/acme-bank-bank-mcp:latest
    build: ./apps/bank-mcp
    pull_policy: ${ACME_BANK_PULL_POLICY:-build}   # build: build it here at each start; always: pull it, build it here if it cannot be pulled
    container_name: gio-bank-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8111:8000"   # The MCP server, unprotected: calling it here skips the gateway
    environment:
      ADMIN_TOKEN: *admin-token   # Token required by POST /admin/reset
      ALLOWED_HOSTS: bank-mcp,localhost,127.0.0.1,[::1]   # The host names it answers to
    labels:
      io.gravitee.name: ACME Bank MCP server
      io.gravitee.description: The bank's tools, served over MCP
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    networks:
      - internal

  bank-agent:
    image: ghcr.io/gravitee-io-labs/gravitee-lab-public-catalog/acme-bank-bank-agent:latest
    build: ./apps/bank-agent
    pull_policy: ${ACME_BANK_PULL_POLICY:-build}
    container_name: gio-bank-agent
    restart: unless-stopped
    depends_on:
      apim-gateway:
        condition: service_healthy
      am-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:8112:8000"   # Ace, behind the gateway's A2A proxy
    environment:
      LLM_URL: http://apim-gateway:8082/acme-bank/llm       # The LLM proxy
      LLM_MODEL: acme-chat                                  # Alias of qwen3:1.7b on the LLM proxy
      LLM_API_KEY: *ace-llm-key                             # ACME_BANK_ACE_LLM_API_KEY
      MCP_URL: http://apim-gateway:8082/acme-bank/mcp       # The MCP proxy, without a trailing slash
      DELEGATION: "on"                                      # Ace acts for the signed-in user, with a token exchanged in Access Management
      AM_TOKEN_URL: http://am-gateway:8092/acme-bank/oauth/token   # Token endpoint of the Access Management domain
      AGENT_CLIENT_ID: ace-agent                            # Ace's application in Access Management
      AGENT_CLIENT_SECRET: *ace-client-secret               # ACME_BANK_ACE_CLIENT_SECRET
      PUBLIC_URL: http://localhost:8082/acme-bank/ace/      # Where clients call Ace (the A2A proxy)
      ALLOWED_HOSTS: bank-agent,localhost,127.0.0.1,[::1]   # The host names it answers to
    labels:
      io.gravitee.name: Ace
      io.gravitee.description: The AI assistant that answers customers, through the gateway
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    networks:
      - internal

  bank-agent-direct:
    image: ghcr.io/gravitee-io-labs/gravitee-lab-public-catalog/acme-bank-bank-agent:latest
    pull_policy: never
    container_name: gio-bank-agent-direct
    restart: unless-stopped
    depends_on:
      bank-mcp:
        condition: service_healthy
    ports:
      - "127.0.0.1:8114:8000"   # Ace with no gateway, identity or policy
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Lets the container reach Ollama on this machine, also on Linux
    environment:
      LLM_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}/v1   # Ollama itself, with no LLM proxy; OLLAMA_URL is where Ollama listens
      LLM_MODEL: qwen3:1.7b                                 # Ollama model name
      MCP_URL: http://bank-mcp:8000/                        # The MCP server itself, with no MCP proxy
      DELEGATION: "off"                                     # No token exchange: the user's token is forwarded as is
      PUBLIC_URL: http://localhost:8114/                    # Where clients call this Ace
      ALLOWED_HOSTS: bank-agent-direct,localhost,127.0.0.1,[::1]   # The host names it answers to
    labels:
      io.gravitee.name: Ace without the gateway
      io.gravitee.description: The same assistant, called directly with no gateway, identity or policy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    networks:
      - internal

  bank-web:
    image: ghcr.io/gravitee-io-labs/gravitee-lab-public-catalog/acme-bank-bank-web:latest
    build: ./apps/bank-web
    pull_policy: ${ACME_BANK_PULL_POLICY:-build}
    container_name: gio-bank-web
    restart: unless-stopped
    depends_on:
      apim-gateway:
        condition: service_healthy
      am-gateway:
        condition: service_healthy
      apim-management-api:
        condition: service_healthy
      bank-mcp:
        condition: service_healthy
      bank-agent-direct:
        condition: service_healthy
      bank-traffic:
        condition: service_healthy
    ports:
      - "127.0.0.1:8110:8000"   # The web app
    environment:
      <<: *platform-login
      BANK_DEMO_PASSWORD: *demo-password
      WEB_CLIENT_SECRET: *web-client-secret
      AM_AUTHORIZE_URL: http://localhost:8092/acme-bank/oauth/authorize   # Login page of the Access Management domain, as your browser reaches it
      AM_TOKEN_URL: http://am-gateway:8092/acme-bank/oauth/token   # Token endpoint of the Access Management domain
      ACE_URL: http://apim-gateway:8082/acme-bank/ace/      # Ace behind the gateway (A2A proxy)
      ACE_DIRECT_URL: http://bank-agent-direct:8000/        # Ace with no gateway, for the Direct setting
      MCP_URL: http://apim-gateway:8082/acme-bank/mcp       # The MCP proxy, without a trailing slash
      MCP_DIRECT_URL: http://bank-mcp:8000/                 # The MCP server itself, for the Direct setting and data reset
      LLM_URL: http://apim-gateway:8082/acme-bank/llm       # The LLM proxy, for the Developers view
      DEV_LLM_API_KEY: *dev-llm-key
      GATEWAY_URL: http://apim-gateway:8082                 # The gateway
      APIM_MANAGEMENT_URL: http://apim-management-api:8083  # The management API, which also serves Gamma
      GAMMA_URL: http://localhost:8086                      # The Gamma console, as your browser reaches it
      TRAFFIC_URL: http://bank-traffic:8000                 # The traffic generator's control port
      ADMIN_TOKEN: *admin-token                             # ACME_BANK_ADMIN_TOKEN
    labels:
      io.gravitee.name: ACME Bank web app
      io.gravitee.description: The bank's web app, where customers chat with Ace
      io.gravitee.console.bank-web.name: ACME Bank
      io.gravitee.console.bank-web.url: http://localhost:8110
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    networks:
      - internal

  bank-api:
    image: ghcr.io/gravitee-io-labs/gravitee-lab-public-catalog/acme-bank-bank-api:latest
    build: ./apps/bank-api
    pull_policy: ${ACME_BANK_PULL_POLICY:-build}
    container_name: gio-bank-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8113:8000"   # The bank's open REST API, which MCP Studio can turn into tools
    labels:
      io.gravitee.name: ACME Bank open API
      io.gravitee.description: The bank's open REST API, which MCP Studio can turn into tools
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    networks:
      - internal

  bank-traffic:
    image: ghcr.io/gravitee-io-labs/gravitee-lab-public-catalog/acme-bank-bank-traffic:latest
    build: ./apps/bank-traffic
    pull_policy: ${ACME_BANK_PULL_POLICY:-build}
    container_name: gio-bank-traffic
    restart: unless-stopped
    depends_on:
      apim-gateway:
        condition: service_healthy
      am-gateway:
        condition: service_healthy
      apim-management-api:
        condition: service_healthy
    environment:
      <<: *platform-login
      BANK_DEMO_PASSWORD: *demo-password
      TRAFFIC_CLIENT_SECRET: *traffic-client-secret
      TRAFFIC_LLM_API_KEY: *traffic-llm-key
      GATEWAY_URL: http://apim-gateway:8082                 # The gateway
      APIM_MANAGEMENT_URL: http://apim-management-api:8083  # The management API, which also serves Gamma
      PROTECTIONS: ${ACME_BANK_PROTECTIONS:-off}            # off: the lessons switch the protections on; on: everything protected from the start. Save & apply restarts the traffic generator, Re-seed puts the protections in the new state
      TRAFFIC: ${ACME_BANK_TRAFFIC:-on}                     # off starts it paused, until the web app's Presenter view resumes it
      TRAFFIC_RATE: ${ACME_BANK_TRAFFIC_RATE:-1}            # How fast it sends, from 0.1 to 10; 1 is one scenario every 2 minutes
    labels:
      io.gravitee.name: ACME Bank traffic
      io.gravitee.description: Sends a steady trickle of customer and developer calls through the gateway
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    networks:
      - internal

  bank-seed:
    image: ghcr.io/gravitee-io-labs/gravitee-lab/seeder:latest
    build: ../../../../../seeder
    pull_policy: ${ACME_BANK_PULL_POLICY:-build}
    container_name: gio-bank-seed
    restart: "no"
    depends_on:
      apim-management-api:
        condition: service_healthy
      am-management-api:
        condition: service_healthy
      apim-gateway:
        condition: service_healthy
      am-gateway:
        condition: service_healthy
      bank-mcp:
        condition: service_healthy
      bank-agent:
        condition: service_healthy
      bank-api:
        condition: service_healthy
    volumes:
      - ./seed:/seed:ro
      - ./.state:/state   # What the seed created, to remove it later
    environment:
      <<: *platform-login
      APIM_MANAGEMENT_URL: http://apim-management-api:8083
      AM_MANAGEMENT_URL: http://am-management-api:8093
      AM_USERNAME: admin
      AM_PASSWORD: *am-password
      APIM_GATEWAY_URL: http://localhost:8082               # The gateway, as you reach it
      GATEWAY_INTERNAL_URL: http://apim-gateway:8082        # The gateway, as the seed reaches it
      GATEWAY_READY_TIMEOUT: ${ACME_BANK_GATEWAY_READY_TIMEOUT:-300}  # Seconds the seed waits for the gateway to serve each API (the first start downloads the AI models)
      AM_GATEWAY_URL: http://am-gateway:8092                # Access Management, as the gateway reaches it
      AM_PUBLIC_URL: http://localhost:8092                  # Access Management, as your browser reaches it
      BANK_MCP_URL: http://bank-mcp:8000                    # The MCP server, without a trailing slash
      BANK_AGENT_URL: http://bank-agent:8000                # Ace
      BANK_API_URL: http://bank-api:8000                    # The open API
      BANK_WEB_URL: http://localhost:8110                   # The web app, as your browser reaches it
      BANK_WEB_LOOPBACK_URL: http://127.0.0.1:8110          # The same, by IP address
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}   # Ollama, as the gateway reaches it
      REDIS_URL: redis://redis:6379                         # The core's Redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}      # The core's Redis password
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}                   # Optional Google AI Studio key: with one, the catalog gets a Gemini provider; empty seeds none
      SEED_PROTECTIONS: ${ACME_BANK_PROTECTIONS:-off}       # State the seed puts the protections in (off or on)
      BANK_DEMO_PASSWORD: *demo-password
      WEB_CLIENT_SECRET: *web-client-secret
      TRAFFIC_CLIENT_SECRET: *traffic-client-secret
      ACE_CLIENT_SECRET: *ace-client-secret
      MCP_RESOURCE_SECRET: *mcp-resource-secret
      ACE_LLM_API_KEY: *ace-llm-key
      DEV_LLM_API_KEY: *dev-llm-key
      LLM_PROBE_KEY: *dev-llm-key                           # Key the seed uses to check the Developers plan cache
      TRAFFIC_LLM_API_KEY: *traffic-llm-key
    labels:
      io.gravitee.name: Playground seed
      io.gravitee.description: Sets up the bank's APIs, applications and identity on the platform
      io.gravitee.role: seed
    networks:
      - internal

  apim-gateway:
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Ollama on this machine, also on Linux
    volumes:
      - data-acme-bank-gateway-models:/opt/graviteeio-gateway/models   # The AI models downloaded on first start (129 MB)

volumes:
  data-acme-bank-gateway-models:
